name: production_deploy
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          script: |
            cd /var/www/proscholy-web && sh deploy/deploy.sh main
            cd /var/www/evangelickyzpevnik-web && sh deploy/deploy.sh main
            cd /var/www/evangelickykancional-web && sh deploy/deploy.sh main
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
      - name: Discord notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_USERNAME: "${{ github.workflow }} - ${{ github.event.repository.name }}"
          DISCORD_AVATAR: "https://upload.wikimedia.org/wikipedia/en/2/2b/Legolas600ppx.jpg"
        with:
          args: "Proběhlo produkční nasazení (frontend) na zpevnik.proscholy.cz! :tada:"
